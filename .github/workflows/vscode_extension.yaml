name: VS Code Extension

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/vscode_extension.yaml"
      - "extensions/vscode/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/vscode_extension.yaml"
      - "extensions/vscode/**"
    tags:
      - "vscode-v*"

defaults:
  run:
    working-directory: extensions/vscode

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🟢 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔨 Compile
        run: npm run compile

      - name: 🔍 Lint
        run: npm run lint

      - name: 📦 Package VSIX
        run: npx @vscode/vsce package --no-git-tag-version

      - name: 📤 Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: extensions/vscode/*.vsix

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🟢 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 📦 Package VSIX
        run: npx @vscode/vsce package --no-git-tag-version

      - name: 🚀 Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --no-git-tag-version
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: 🏷️ Ensure Open VSX Namespace
        run: |
          out=$(npx ovsx create-namespace flutterPlaza-com -p "$OVSX_PAT" 2>&1) || {
            echo "$out"
            echo "$out" | grep -qi "already exists" || exit 1
          }
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: 🚀 Publish to Open VSX
        run: npx ovsx publish *.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: 🏷️ Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: extensions/vscode/*.vsix
          generate_release_notes: true
