name: IntelliJ Plugin

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/intellij_plugin.yaml"
      - "extensions/intellij/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/intellij_plugin.yaml"
      - "extensions/intellij/**"
    tags:
      - "intellij-v*"

defaults:
  run:
    working-directory: extensions/intellij

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: ☕ Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 🔨 Build
        run: ./gradlew buildPlugin

      - name: 📤 Upload Plugin Artifact
        uses: actions/upload-artifact@v7
        with:
          name: intellij-plugin
          path: extensions/intellij/build/distributions/*.zip

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🧹 Free Runner Disk Space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        working-directory: /

      - name: ☕ Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: ✅ Verify Against Supported Android Studio Releases
        run: ./gradlew verifyPlugin

      - name: 📤 Upload Verifier Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-reports
          path: extensions/intellij/build/reports/pluginVerifier
          if-no-files-found: ignore

  publish:
    needs: [build, verify]
    if: startsWith(github.ref, 'refs/tags/intellij-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: ☕ Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 🚀 Publish to JetBrains Marketplace
        run: ./gradlew publishPlugin
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}

      - name: 📥 Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: intellij-plugin
          path: dist

      - name: 🏷️ Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          # An empty dist/ must fail the release, not publish one with no
          # plugin attached (the upload/download pair only runs on tags,
          # so PR CI can never catch that).
          fail_on_unmatched_files: true
          generate_release_notes: true
