name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # Repo secrets are not available to PRs from forks; skip them.
    # Drafts are skipped too — review runs when the PR is ready.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # SHA-pinned. This job holds pull-requests: write and the Claude OAuth
      # token, and the same workflow is installed in six repos — so a tag
      # repointed upstream is a six-repo compromise, not a one-repo one. The
      # tag stays in the comment because that is the thing a human reads when
      # deciding whether to bump it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      # Route the review model by PR complexity: small mechanical diffs get
      # Haiku, standard changes get Sonnet, and large or sensitive-path
      # changes (command implementations, shipped binaries/extensions, CI)
      # get Opus.
      - name: Pick review model by complexity
        id: model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHANGED=$(( ${{ github.event.pull_request.additions }} + ${{ github.event.pull_request.deletions }} ))
          SENSITIVE=$(gh pr view ${{ github.event.pull_request.number }} \
            --repo "${{ github.repository }}" --json files \
            -q '[.files[].path | select(test("^(lib/src/commands/|bin/|extensions/|\\.github/workflows/)"))] | length' || echo 1)
          if [ "$CHANGED" -le 60 ] && [ "$SENSITIVE" -eq 0 ]; then
            MODEL=claude-haiku-4-5-20251001
          elif [ "$CHANGED" -le 1200 ] && [ "$SENSITIVE" -eq 0 ]; then
            MODEL=claude-sonnet-5
          else
            MODEL=claude-opus-5
          fi
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "changed=$CHANGED sensitive=$SENSITIVE model=$MODEL"

      - uses: anthropics/claude-code-action@5ccc3a35a6367cdb8e6fbd0728287467540ecfe2 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this Dart CLI pull request. This tool sets up
            Flutter/engine development environments, drives code push build
            and release workflows, and ships the VS Code / IntelliJ
            extensions that live in the same repo.

            Focus on:
            - Correctness bugs and edge cases
            - Process execution and file I/O safety
            - Cross-platform shell behavior (macOS and Linux)
            - Backwards compatibility of CLI commands, flags, and config
            files
            - Error messages and recovery guidance
            - Test coverage for new behavior

            Before raising a finding, read the PR's existing comments
            (`gh pr view <n> --comments`). Do not re-raise a finding the
            author has already refuted or explicitly tabled there unless you
            have new evidence. When claiming a control-flow gap (e.g. a
            missing try/finally), read the entire enclosing function first
            and cite the line numbers that demonstrate it.

            Post your review as a SINGLE comment using one `gh pr comment`
            call — do not post multiple comments or inline comments.

            Structure the comment with exactly these sections, in this order:

            ## 🔴 Critical
            Bugs, crashes, security issues, breaking changes — anything that
            must be fixed before merging. Critical findings always block the
            merge. Write "None" if there are none.

            ## 🟠 Medium
            Real defects or risks that are not immediately breaking (missing
            edge-case handling, missing tests). Up to two open Mediums may
            merge, provided each unfixed one is filed as its own issue
            labelled `deferred-medium` first; three or more block until fixed
            or refuted down to two. Write "None" if there are none.

            ## 🟡 Low
            Minor improvements and suggestions. These may be tabled as tracked
            follow-ups. Write "None" if there are none.

            ## 🟢 Positives
            What the PR does well.

            For each finding, reference the file and line (e.g. `lib/foo.dart:42`)
            and explain briefly why it matters. Keep it concise and only flag
            issues that matter — skip style nitpicks already covered by
            `dart format` and `dart analyze`.
          claude_args: |
            --model ${{ steps.model.outputs.model }}
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
